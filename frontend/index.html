<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSAD Monitor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        body {
            margin: 0;
            overflow: hidden;
        }

        /* Custom scrollbar for the ECharts tooltip */
        .echarts-tooltip::-webkit-scrollbar {
            width: 6px;
        }

        .echarts-tooltip::-webkit-scrollbar-track {
            background: transparent;
        }

        .echarts-tooltip::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans h-screen flex">

    <div id="root" class="w-full h-full flex"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const API_BASE_URL = 'http://localhost:8080/api/v1/dataset';

        // Function to generate a constant distinct color for each feature index
        const getFeatureColor = (index) => {
            const hue = (index * 137.508) % 360;
            return `hsl(${hue}, 70%, 45%)`;
        };

        const EChart = ({ activeDataset, type, datasetsStateRef, forceUpdate }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                chartInstance.current = echarts.init(chartRef.current);

                const option = {
                    animation: false,
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'cross' },
                        confine: true,
                        enterable: true,
                        className: 'echarts-tooltip',
                        extraCssText: 'max-height: 250px; overflow-y: auto; pointer-events: auto;',
                        formatter: function (params) {
                            if (!params || !params.length) return '';
                            const sortedParams = [...params].sort((a, b) => Math.abs(b.value || 0) - Math.abs(a.value || 0));
                            let html = `<div style="font-size:12px;color:#666;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #eee;">Index: <b style="color:#333">${String(params[0].axisValue).split('_')[0]}</b></div>`;
                            sortedParams.forEach(p => {
                                const isZero = p.value === 0;
                                const valStyle = isZero ? 'color: #999; font-weight: normal;' : 'color: #111; font-weight: bold;';
                                const bgStyle = isZero ? '' : 'background-color: rgba(0,0,0,0.03); border-radius: 4px;';
                                html += `
                                    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:2px 4px;${bgStyle}">
                                        <div style="display:flex;align-items:center;gap:6px">
                                            ${p.marker}
                                            <span style="font-size:13px;${isZero ? 'color:#777' : 'color:#111;font-weight:500'}">${p.seriesName}</span>
                                        </div>
                                        <span style="font-size:13px;font-family:monospace;${valStyle}">${p.value}</span>
                                    </div>
                                `;
                            });
                            return html;
                        }
                    },
                    legend: { show: false },
                    grid: {
                        left: '3%', right: '2%', bottom: '30px', top: '10px',
                        containLabel: true
                    },
                    dataZoom: [
                        { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
                        { type: 'slider', xAxisIndex: 0, filterMode: 'none' }
                    ],
                    xAxis: {
                        type: 'category', name: 'Time/Index', nameLocation: 'middle', nameGap: 25, boundaryGap: false,
                        data: []
                    },
                    yAxis: [
                        { type: 'value', name: 'Sensor Value' },
                        { type: 'value', name: 'Accuracy', show: false, min: -1, max: 4, splitLine: { show: false } }
                    ],
                    series: []
                };

                chartInstance.current.setOption(option);

                const resizeObserver = new ResizeObserver(() => {
                    chartInstance.current?.resize();
                });
                if (chartRef.current) resizeObserver.observe(chartRef.current);

                return () => {
                    resizeObserver.disconnect();
                    chartInstance.current?.dispose();
                };
            }, []);

            const getChartOptions = (state, visibleFeatures) => {
                const series = [];
                for (let i = 0; i < state.values.length; i++) {
                    if (visibleFeatures && visibleFeatures.has(i)) {
                        series.push({
                            name: `Feature ${i + 1}`,
                            type: 'line',
                            symbol: 'none',
                            lineStyle: { width: 1.5 },
                            itemStyle: { color: getFeatureColor(i) },
                            data: state.values[i]
                        });
                    }
                }

                const hasAccuracy = state.accuracies && state.accuracies.some(a => a !== null);
                if (hasAccuracy) {
                    const markAreaData = [];
                    let startIdx = null;
                    let currentAcc = null;

                    for (let i = 0; i < state.accuracies.length; i++) {
                        const acc = state.accuracies[i];
                        if (acc !== currentAcc) {
                            if (currentAcc !== null && startIdx !== null) {
                                let color = 'rgba(0,0,0,0)';
                                if (currentAcc === 0) color = 'rgba(0, 0, 0, 0)';
                                else if (currentAcc === 1) color = 'rgba(59, 130, 246, 0.3)';
                                else if (currentAcc === 2) color = 'rgba(234, 179, 8, 0.3)';
                                else if (currentAcc === 3) color = 'rgba(239, 68, 68, 0.3)';

                                markAreaData.push([
                                    { xAxis: state.labels[startIdx], itemStyle: { color: color } },
                                    { xAxis: state.labels[i - 1] }
                                ]);
                            }
                            startIdx = acc !== null ? i : null;
                            currentAcc = acc;
                        }
                    }

                    if (currentAcc !== null && startIdx !== null && startIdx < state.accuracies.length) {
                        let color = 'rgba(0,0,0,0)';
                        if (currentAcc === 0) color = 'rgba(0, 0, 0, 0)';
                        else if (currentAcc === 1) color = 'rgba(59, 130, 246, 0.3)';
                        else if (currentAcc === 2) color = 'rgba(234, 179, 8, 0.3)';
                        else if (currentAcc === 3) color = 'rgba(239, 68, 68, 0.3)';

                        markAreaData.push([
                            { xAxis: state.labels[startIdx], itemStyle: { color: color } },
                            { xAxis: state.labels[state.labels.length - 1] }
                        ]);
                    }

                    series.push({
                        name: 'Accuracy Bands',
                        type: 'line',
                        markArea: { silent: true, data: markAreaData },
                        data: []
                    });
                }

                return {
                    xAxis: {
                        data: state.labels,
                        axisLabel: {
                            formatter: function (value) {
                                return value ? String(value).split('_')[0] : '';
                            }
                        },
                        axisPointer: {
                            label: {
                                formatter: function (params) {
                                    return params.value ? String(params.value).split('_')[0] : '';
                                }
                            }
                        }
                    },
                    yAxis: { type: 'value', name: 'Sensor Value' },
                    series: series
                };
            };

            useEffect(() => {
                if (!chartInstance.current || !activeDataset) return;
                const dsState = datasetsStateRef.current[activeDataset];
                if (!dsState) return;
                const state = dsState[type];
                const visibleFeatures = dsState.visibleFeatures;
                if (!state) return;
                chartInstance.current.setOption(getChartOptions(state, visibleFeatures), { replaceMerge: ['series'] });
            }, [activeDataset, forceUpdate, type]);

            useEffect(() => {
                let animationFrameId;
                const updateChart = () => {
                    if (!chartInstance.current || !activeDataset) return;
                    const dsState = datasetsStateRef.current[activeDataset];
                    if (dsState) {
                        const state = dsState[type];
                        const visibleFeatures = dsState.visibleFeatures;
                        if (state && state.isStreaming) {
                            chartInstance.current.setOption(getChartOptions(state, visibleFeatures), { replaceMerge: ['series'] });
                        }
                    }
                    setTimeout(() => {
                        animationFrameId = requestAnimationFrame(updateChart);
                    }, 100);
                };

                animationFrameId = requestAnimationFrame(updateChart);
                return () => {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                };
            }, [activeDataset, type]);

            window[`resetEChartZoom_${type}`] = () => {
                if (chartInstance.current) {
                    chartInstance.current.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
                }
            };

            return <div ref={chartRef} className="w-full h-full"></div>;
        };

        const App = () => {
            const [activeDataset, setActiveDataset] = useState('');
            const [infos, setInfos] = useState({});
            const [errors, setErrors] = useState({});
            const [tick, setTick] = useState(0);
            const [isFilterOpen, setIsFilterOpen] = useState(false);

            const [selectedModel, setSelectedModel] = useState('isolation-forest-v1');
            const availableModels = ['isolation-forest-v1', 'autoencoder', 'lstm'];

            const datasetsStateRef = useRef({});

            const initDatasetState = (name, dimension = 0) => {
                if (!datasetsStateRef.current[name]) {
                    const initialFeatures = new Set();
                    const limit = dimension > 0 ? Math.min(5, dimension) : 5;
                    for (let i = 0; i < limit; i++) {
                        initialFeatures.add(i);
                    }

                    const createEmptyState = () => ({
                        labels: [], values: [], accuracies: [], eventSource: null, isStreaming: false, points: 0,
                        status: 'Waiting to start...'
                    });

                    datasetsStateRef.current[name] = {
                        visibleFeatures: initialFeatures,
                        stream: createEmptyState(),
                        evaluate: createEmptyState()
                    };
                }
            };

            const fetchInfo = async (name) => {
                setErrors(prev => ({ ...prev, [name]: null }));
                try {
                    const response = await fetch(`${API_BASE_URL}/${name}/info`);
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    const data = await response.json();

                    setInfos(prev => ({ ...prev, [name]: data }));

                    const dsState = datasetsStateRef.current[name];
                    if (dsState && dsState.stream.values.length === 0 && dsState.evaluate.values.length === 0) {
                        const newSet = new Set();
                        const limit = Math.min(5, data.dimension);
                        for (let i = 0; i < limit; i++) newSet.add(i);
                        dsState.visibleFeatures = newSet;
                        setTick(t => t + 1);
                    }
                } catch (err) {
                    setErrors(prev => ({ ...prev, [name]: `Failed to connect to backend: ${err.message}` }));
                }
            };

            const selectDataset = (name) => {
                initDatasetState(name, infos[name] ? infos[name].dimension : 0);
                setActiveDataset(name);
                setIsFilterOpen(false);
                if (!infos[name]) fetchInfo(name);
                setTick(t => t + 1);
            };

            const startStream = () => {
                if (!activeDataset) return;
                const state = datasetsStateRef.current[activeDataset].stream;
                if (state.isStreaming) return;

                if (state.eventSource) state.eventSource.close();

                state.isStreaming = true;
                state.status = 'Streaming...';

                const url = `${API_BASE_URL}/${activeDataset}/stream`;
                const source = new EventSource(url);
                state.eventSource = source;

                let localCounter = 0;

                source.addEventListener('point', (e) => {
                    const data = JSON.parse(e.data);
                    state.labels.push(data.index + '_' + state.points);

                    while (state.values.length < data.values.length) {
                        state.values.push([]);
                    }
                    for (let i = 0; i < data.values.length; i++) {
                        state.values[i].push(data.values[i]);
                    }

                    if (data.accuracy !== undefined && data.accuracy !== null) {
                        state.accuracies.push(data.accuracy);
                    } else {
                        state.accuracies.push(null);
                    }

                    localCounter++;
                    state.points++;
                    if (localCounter % 15 === 0) setTick(t => t + 1);
                });

                source.addEventListener('complete', () => {
                    stopStreamType(activeDataset, 'stream');
                    datasetsStateRef.current[activeDataset].stream.status = 'Stream Complete.';
                    setTick(t => t + 1);
                });

                source.onerror = (err) => {
                    console.error('SSE Error', err);
                    stopStreamType(activeDataset, 'stream');
                    datasetsStateRef.current[activeDataset].stream.status = 'Connection Error or Stream Closed';
                    setTick(t => t + 1);
                };

                setTick(t => t + 1);
            };

            const startEvaluate = () => {
                if (!activeDataset) return;

                const state = datasetsStateRef.current[activeDataset].evaluate;
                if (state.isStreaming) return;
                if (state.eventSource) state.eventSource.close();

                state.isStreaming = true;
                state.status = `Evaluating with ${selectedModel}...`;

                const url = `${API_BASE_URL}/${activeDataset}/evaluate?model=${encodeURIComponent(selectedModel)}`;
                const source = new EventSource(url);
                state.eventSource = source;

                let localCounter = 0;

                source.addEventListener('point', (e) => {
                    const data = JSON.parse(e.data);
                    state.labels.push(data.index + '_' + state.points);

                    while (state.values.length < data.values.length) {
                        state.values.push([]);
                    }
                    for (let i = 0; i < data.values.length; i++) {
                        state.values[i].push(data.values[i]);
                    }

                    if (data.accuracy !== undefined && data.accuracy !== null) {
                        state.accuracies.push(data.accuracy);
                    } else {
                        state.accuracies.push(null);
                    }

                    localCounter++;
                    state.points++;
                    if (localCounter % 15 === 0) setTick(t => t + 1);
                });

                source.addEventListener('complete', () => {
                    stopStreamType(activeDataset, 'evaluate');
                    datasetsStateRef.current[activeDataset].evaluate.status = 'Evaluation Complete.';
                    setTick(t => t + 1);
                });

                source.onerror = (err) => {
                    console.error('SSE Error during evaluate', err);
                    stopStreamType(activeDataset, 'evaluate');
                    datasetsStateRef.current[activeDataset].evaluate.status = 'Connection Error or Stream Closed';
                    setTick(t => t + 1);
                };

                setTick(t => t + 1);
            };

            const stopStreamType = (name, type) => {
                const state = datasetsStateRef.current[name]?.[type];
                if (state && state.eventSource) {
                    state.eventSource.close();
                    state.eventSource = null;
                }
                if (state) {
                    state.isStreaming = false;
                    if (state.status.includes('...')) state.status = 'Stopped manually';
                }
            };

            const clearData = (type) => {
                if (!activeDataset) return;
                stopStreamType(activeDataset, type);
                const state = datasetsStateRef.current[activeDataset][type];
                state.labels = []; state.values = []; state.accuracies = []; state.points = 0; state.status = 'Cleared';
                setTick(t => t + 1);
            };

            const startBoth = () => {
                clearBoth();
                startStream();
                startEvaluate();
            };

            const stopBoth = () => {
                stopStreamType(activeDataset, 'stream');
                stopStreamType(activeDataset, 'evaluate');
                setTick(t => t + 1);
            };

            const clearBoth = () => {
                clearData('stream');
                clearData('evaluate');
            };

            const currentState = datasetsStateRef.current[activeDataset] || {};
            const currentInfo = infos[activeDataset];
            const currentError = errors[activeDataset];

            return (
                <div className="flex w-full h-full">
                    <aside className="w-64 bg-white shadow-lg h-full flex flex-col z-20 flex-shrink-0">
                        <div className="p-6 border-b">
                            <h1 className="text-2xl font-bold text-blue-600 tracking-tight">TSAD Monitor</h1>
                            <p className="text-sm text-gray-500 mt-1">Anomaly Detection</p>
                        </div>
                        <div className="p-4 flex-1">
                            <h2 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Select Dataset</h2>
                            <div className="space-y-3">
                                {['2Dgesture', 'MSL'].map(m => {
                                    const isStreaming = datasetsStateRef.current[m]?.stream.isStreaming || datasetsStateRef.current[m]?.evaluate.isStreaming;
                                    return (
                                        <button
                                            key={m}
                                            onClick={() => selectDataset(m)}
                                            className={`w-full text-left px-4 py-3 rounded-lg border transition-all flex items-center justify-between ${activeDataset === m
                                                ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500'
                                                : 'border-gray-200 bg-white hover:border-blue-300'
                                                }`}
                                        >
                                            <div className="flex items-center gap-2">
                                                {isStreaming && (
                                                    <span className="flex h-2 w-2 relative">
                                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                                        <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                                    </span>
                                                )}
                                                <span className={`font-medium ${activeDataset === m ? 'text-blue-700' : 'text-gray-700'}`}>{m}</span>
                                            </div>
                                            {activeDataset === m && (
                                                <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-hidden bg-gray-50 p-2 lg:p-3 flex flex-col relative z-10">
                        {!activeDataset ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center">
                                <svg className="w-24 h-24 text-blue-200 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <h2 className="text-3xl font-bold text-gray-700 mb-2">Welcome to TSAD Monitor</h2>
                                <p className="text-gray-500">Select a dataset from the sidebar to start streaming.</p>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col space-y-2 overflow-hidden">
                                <div className="bg-white p-2 px-4 rounded-xl shadow-sm border border-gray-200 shrink-0">
                                    <div className="flex flex-wrap gap-4 justify-between items-center mb-2">
                                        <h2 className="text-xl font-bold text-gray-800">Dataset: {activeDataset}</h2>

                                        <div className="flex items-center gap-3">
                                            <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1">
                                                <span className="text-xs font-semibold text-gray-500">API 3 Model:</span>
                                                <select
                                                    className="border-none bg-transparent text-sm font-medium text-blue-700 focus:ring-0 outline-none cursor-pointer"
                                                    value={selectedModel}
                                                    onChange={(e) => setSelectedModel(e.target.value)}
                                                    disabled={currentState.evaluate?.isStreaming}
                                                >
                                                    {availableModels.map(m => (
                                                        <option key={m} value={m}>{m}</option>
                                                    ))}
                                                </select>
                                            </div>

                                            {!(currentState.stream?.isStreaming || currentState.evaluate?.isStreaming) ? (
                                                <button onClick={startBoth} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition">
                                                    Start Streaming
                                                </button>
                                            ) : (
                                                <button onClick={stopBoth} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition">
                                                    Stop Streaming
                                                </button>
                                            )}

                                            <button onClick={clearBoth} className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition" title="Clear Data">
                                                Clear Data
                                            </button>

                                            <div className="relative">
                                                <button
                                                    onClick={() => setIsFilterOpen(!isFilterOpen)}
                                                    className="bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                                                    Filter ({currentState.visibleFeatures?.size || 0})
                                                </button>
                                                {isFilterOpen && (
                                                    <>
                                                        <div className="fixed inset-0 z-30" onClick={() => setIsFilterOpen(false)}></div>
                                                        <div className="absolute right-0 mt-2 w-56 bg-white border border-gray-200 shadow-2xl rounded-lg z-40 flex flex-col">
                                                            <div className="p-3 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                                                                <span className="text-sm font-bold text-gray-700">Show Features</span>
                                                                <div className="flex gap-2">
                                                                    <button onClick={() => {
                                                                        const st = datasetsStateRef.current[activeDataset];
                                                                        const count = currentInfo?.dimension || 0;
                                                                        st.visibleFeatures = new Set(Array.from({ length: count }, (_, i) => i));
                                                                        setTick(t => t + 1);
                                                                    }} className="text-xs text-blue-600 hover:underline">All</button>
                                                                    <button onClick={() => {
                                                                        datasetsStateRef.current[activeDataset].visibleFeatures = new Set();
                                                                        setTick(t => t + 1);
                                                                    }} className="text-xs text-blue-600 hover:underline">None</button>
                                                                </div>
                                                            </div>
                                                            <div className="max-h-64 overflow-y-auto p-2">
                                                                {(() => {
                                                                    const numFeatures = currentInfo?.dimension || 0;
                                                                    if (numFeatures === 0) return <div className="text-xs text-gray-400 p-2">No features available</div>;

                                                                    return Array.from({ length: numFeatures }).map((_, i) => (
                                                                        <label key={i} className="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer">
                                                                            <input
                                                                                type="checkbox"
                                                                                className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer"
                                                                                checked={currentState.visibleFeatures?.has(i) || false}
                                                                                onChange={(e) => {
                                                                                    const st = datasetsStateRef.current[activeDataset];
                                                                                    const newSet = new Set(st.visibleFeatures);
                                                                                    if (e.target.checked) newSet.add(i);
                                                                                    else newSet.delete(i);
                                                                                    st.visibleFeatures = newSet;
                                                                                    setTick(t => t + 1);
                                                                                }}
                                                                            />
                                                                            <span className="text-sm font-medium select-none flex items-center gap-2">
                                                                                <span className="w-3 h-3 rounded-full" style={{ backgroundColor: getFeatureColor(i) }}></span>
                                                                                Feature {i + 1}
                                                                            </span>
                                                                        </label>
                                                                    ));
                                                                })()}
                                                            </div>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                            <button
                                                onClick={() => fetchInfo(activeDataset)}
                                                className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2"
                                            >
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                                Refresh Metadata
                                            </button>
                                        </div>
                                    </div>

                                    {currentError ? (
                                        <div className="bg-red-50 text-red-600 p-4 rounded-lg border border-red-100">
                                            {currentError}
                                        </div>
                                    ) : !currentInfo ? (
                                        <p className="text-gray-400 animate-pulse">Loading metadata...</p>
                                    ) : (
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">
                                            {[
                                                { label: 'Datapath', value: currentInfo.datapath },
                                                { label: 'Shape', value: `[${currentInfo.shape.join(', ')}]` },
                                                { label: 'DType', value: currentInfo.dtype },
                                                { label: 'Length', value: currentInfo.length },
                                                { label: 'Dimension', value: currentInfo.dimension },
                                                {
                                                    label: 'Anomaly %',
                                                    value: currentInfo.anomalyPercent !== null
                                                        ? <span className="text-red-600 font-bold">{parseFloat(currentInfo.anomalyPercent).toFixed(2)}%</span>
                                                        : <span className="text-gray-400 font-normal">N/A</span>
                                                },
                                            ].map((item, idx) => (
                                                <div key={idx} className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                                                    <p className="text-xs text-gray-500 uppercase tracking-wider mb-1">{item.label}</p>
                                                    <p className="text-lg font-semibold text-gray-800 truncate" title={String(item.value)}>{item.value}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="flex-1 grid grid-rows-2 gap-2 min-h-0">
                                    {/* Top Chart (Evaluate - API 3) */}
                                    <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-200 flex flex-col relative min-h-0">
                                        <div className="flex flex-wrap justify-between items-center mb-1 gap-2">
                                            <div className="flex items-center gap-2">
                                                <h3 className="text-sm font-bold text-gray-800">Anomaly Detection (API 3)</h3>
                                                <span className={`text-xs font-medium ${currentState.evaluate?.isStreaming ? 'text-green-600 animate-pulse' : currentState.evaluate?.status?.includes('Error') ? 'text-red-600' : 'text-gray-500'}`}>{currentState.evaluate?.status}</span>
                                            </div>

                                            <div className="flex items-center gap-2 text-xs">
                                                <span className="bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-mono">Pts: {currentState.evaluate?.points || 0}</span>
                                                <button onClick={() => window.resetEChartZoom_evaluate && window.resetEChartZoom_evaluate()} className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-md font-medium transition">Reset Zoom</button>
                                            </div>
                                        </div>

                                        <div className="flex-1 w-full relative min-h-0">
                                            <EChart activeDataset={activeDataset} type="evaluate" datasetsStateRef={datasetsStateRef} forceUpdate={tick} />
                                        </div>
                                    </div>

                                    {/* Bottom Chart (Stream - API 2) */}
                                    <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-200 flex flex-col relative min-h-0">
                                        <div className="flex flex-wrap justify-between items-center mb-1 gap-2">
                                            <div className="flex items-center gap-2">
                                                <h3 className="text-sm font-bold text-gray-800">Live Telemetry (API 2)</h3>
                                                <span className={`text-xs font-medium ${currentState.stream?.isStreaming ? 'text-green-600 animate-pulse' : currentState.stream?.status?.includes('Error') ? 'text-red-600' : 'text-gray-500'}`}>{currentState.stream?.status}</span>
                                            </div>

                                            <div className="flex items-center gap-2 text-xs">
                                                <span className="bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-mono">Pts: {currentState.stream?.points || 0}</span>
                                                <button onClick={() => window.resetEChartZoom_stream && window.resetEChartZoom_stream()} className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-md font-medium transition">Reset Zoom</button>
                                            </div>
                                        </div>

                                        <div className="flex-1 w-full relative min-h-0">
                                            <EChart activeDataset={activeDataset} type="stream" datasetsStateRef={datasetsStateRef} forceUpdate={tick} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
