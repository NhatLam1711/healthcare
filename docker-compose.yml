version: "3.9"

services:
  anomaly-model:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anomaly-model
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:latest
    container_name: anomaly-nginx
    restart: unless-stopped
    depends_on:
      - anomaly-model
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
