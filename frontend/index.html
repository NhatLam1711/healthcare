<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSAD Monitor</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { margin: 0; overflow: hidden; }
        
        /* Custom scrollbar for the ECharts tooltip */
        .echarts-tooltip::-webkit-scrollbar { width: 6px; }
        .echarts-tooltip::-webkit-scrollbar-track { background: transparent; }
        .echarts-tooltip::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex">
    
    <div id="root" class="w-full h-full flex"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const API_BASE_URL = 'http://localhost:8080/api/v1/dataset';

        // Function to generate a constant distinct color for each feature index
        const getFeatureColor = (index) => {
            const hue = (index * 137.508) % 360;
            return `hsl(${hue}, 70%, 45%)`;
        };

        const EChart = ({ activeDataset, datasetsStateRef, forceUpdate }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                chartInstance.current = echarts.init(chartRef.current);
                
                const option = {
                    animation: false,
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'cross' },
                        confine: true, // Prevent tooltip from going outside the canvas
                        enterable: true, // Allow mouse to enter tooltip so user can scroll it
                        className: 'echarts-tooltip',
                        extraCssText: 'max-height: 250px; overflow-y: auto; pointer-events: auto;',
                        
                        // Smart Formatter: Sorts tooltip items by absolute value (Highest first)
                        // This makes identifying spikes/anomalies instantaneous without scrolling!
                        formatter: function(params) {
                            if (!params || !params.length) return '';
                            
                            // Sort by absolute value descending
                            const sortedParams = [...params].sort((a, b) => Math.abs(b.value || 0) - Math.abs(a.value || 0));
                            
                            let html = `<div style="font-size:12px;color:#666;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #eee;">Index: <b style="color:#333">${params[0].axisValue}</b></div>`;
                            
                            sortedParams.forEach(p => {
                                // Highlight features that are actively spiking/moving (not 0)
                                const isZero = p.value === 0;
                                const valStyle = isZero ? 'color: #999; font-weight: normal;' : 'color: #111; font-weight: bold;';
                                const bgStyle = isZero ? '' : 'background-color: rgba(0,0,0,0.03); border-radius: 4px;';
                                
                                html += `
                                    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:2px 4px;${bgStyle}">
                                        <div style="display:flex;align-items:center;gap:6px">
                                            ${p.marker}
                                            <span style="font-size:13px;${isZero ? 'color:#777' : 'color:#111;font-weight:500'}">${p.seriesName}</span>
                                        </div>
                                        <span style="font-size:13px;font-family:monospace;${valStyle}">${p.value}</span>
                                    </div>
                                `;
                            });
                            return html;
                        }
                    },
                    legend: { show: false },
                    grid: {
                        left: '3%', right: '4%', bottom: '15%', top: '5%', 
                        containLabel: true
                    },
                    dataZoom: [
                        { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
                        { type: 'slider', xAxisIndex: 0, filterMode: 'none' }
                    ],
                    xAxis: {
                        type: 'category', name: 'Time/Index', nameLocation: 'middle', nameGap: 25, boundaryGap: false,
                        data: []
                    },
                    yAxis: {
                        type: 'value', name: 'Sensor Value'
                    },
                    series: []
                };
                
                chartInstance.current.setOption(option);
                
                const handleResize = () => chartInstance.current?.resize();
                window.addEventListener('resize', handleResize);
                
                return () => {
                    window.removeEventListener('resize', handleResize);
                    chartInstance.current?.dispose();
                };
            }, []);

            const getChartOptions = (state) => {
                const series = [];
                for (let i = 0; i < state.values.length; i++) {
                    if (state.visibleFeatures.has(i)) {
                        series.push({
                            name: `Feature ${i + 1}`,
                            type: 'line',
                            symbol: 'none',
                            lineStyle: { width: 1.5 },
                            itemStyle: { color: getFeatureColor(i) },
                            data: state.values[i]
                        });
                    }
                }
                return { xAxis: { data: state.labels }, series: series };
            };

            useEffect(() => {
                if (!chartInstance.current || !activeDataset) return;
                const state = datasetsStateRef.current[activeDataset];
                if (!state) return;
                chartInstance.current.setOption(getChartOptions(state), { replaceMerge: ['series'] });
            }, [activeDataset, forceUpdate]);

            useEffect(() => {
                let animationFrameId;
                const updateChart = () => {
                    if (!chartInstance.current || !activeDataset) return;
                    const state = datasetsStateRef.current[activeDataset];
                    if (state && state.isStreaming) {
                        chartInstance.current.setOption(getChartOptions(state), { replaceMerge: ['series'] });
                    }
                    setTimeout(() => {
                        animationFrameId = requestAnimationFrame(updateChart);
                    }, 100); 
                };

                animationFrameId = requestAnimationFrame(updateChart);
                return () => {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                };
            }, [activeDataset]);

            window.resetEChartZoom = () => {
                if (chartInstance.current) {
                    chartInstance.current.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
                }
            };

            return <div ref={chartRef} className="w-full h-full"></div>;
        };

        const App = () => {
            const [activeDataset, setActiveDataset] = useState('');
            const [infos, setInfos] = useState({});
            const [errors, setErrors] = useState({});
            const [tick, setTick] = useState(0); 
            const [isFilterOpen, setIsFilterOpen] = useState(false);
            
            const datasetsStateRef = useRef({});

            const initDatasetState = (name, dimension = 0) => {
                if (!datasetsStateRef.current[name]) {
                    const initialFeatures = new Set();
                    const limit = dimension > 0 ? Math.min(5, dimension) : 5;
                    for(let i = 0; i < limit; i++) {
                        initialFeatures.add(i);
                    }
                    
                    datasetsStateRef.current[name] = {
                        labels: [], values: [], eventSource: null, isStreaming: false, points: 0,
                        status: 'Waiting to start...', visibleFeatures: initialFeatures
                    };
                }
            };

            const fetchInfo = async (name) => {
                setErrors(prev => ({ ...prev, [name]: null }));
                try {
                    const response = await fetch(`${API_BASE_URL}/${name}/info`);
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    const data = await response.json();
                    
                    setInfos(prev => ({ ...prev, [name]: data }));
                    
                    const state = datasetsStateRef.current[name];
                    if (state && state.values.length === 0) {
                        const newSet = new Set();
                        const limit = Math.min(5, data.dimension);
                        for(let i=0; i<limit; i++) newSet.add(i);
                        state.visibleFeatures = newSet;
                        setTick(t => t + 1);
                    }
                } catch (err) {
                    setErrors(prev => ({ ...prev, [name]: `Failed to connect to backend: ${err.message}` }));
                }
            };

            const selectDataset = (name) => {
                initDatasetState(name, infos[name] ? infos[name].dimension : 0);
                setActiveDataset(name);
                setIsFilterOpen(false);
                if (!infos[name]) fetchInfo(name);
                setTick(t => t + 1);
            };

            const startStream = () => {
                if (!activeDataset) return;
                const state = datasetsStateRef.current[activeDataset];
                if (state.isStreaming) return; 
                
                if (state.eventSource) state.eventSource.close();

                state.isStreaming = true;
                state.status = 'Streaming...';
                
                const url = `${API_BASE_URL}/${activeDataset}/stream`;
                const source = new EventSource(url);
                state.eventSource = source;
                
                let localCounter = 0;

                source.addEventListener('point', (e) => {
                    const data = JSON.parse(e.data);
                    state.labels.push(data.index);
                    
                    while (state.values.length < data.values.length) {
                        state.values.push([]);
                    }
                    for (let i = 0; i < data.values.length; i++) {
                        state.values[i].push(data.values[i]);
                    }
                    
                    localCounter++;
                    state.points++;
                    if (localCounter % 15 === 0) setTick(t => t + 1);
                });

                source.addEventListener('complete', () => {
                    stopStreamForDataset(activeDataset);
                    datasetsStateRef.current[activeDataset].status = 'Stream Complete (EOF)';
                    setTick(t => t + 1);
                });

                source.onerror = (err) => {
                    console.error('SSE Error', err);
                    stopStreamForDataset(activeDataset);
                    datasetsStateRef.current[activeDataset].status = 'Connection Error or Stream Closed';
                    setTick(t => t + 1);
                };
                
                setTick(t => t + 1);
            };

            const stopStreamForDataset = (name) => {
                const state = datasetsStateRef.current[name];
                if (state && state.eventSource) {
                    state.eventSource.close();
                    state.eventSource = null;
                }
                if (state) {
                    state.isStreaming = false;
                    if (state.status === 'Streaming...') state.status = 'Stopped manually';
                }
            };

            const stopStream = () => {
                stopStreamForDataset(activeDataset);
                setTick(t => t + 1);
            };
            
            const clearData = () => {
                if (!activeDataset) return;
                stopStreamForDataset(activeDataset);
                const state = datasetsStateRef.current[activeDataset];
                state.labels = []; state.values = []; state.points = 0; state.status = 'Cleared';
                setTick(t => t + 1);
            };

            const currentState = datasetsStateRef.current[activeDataset] || {};
            const currentInfo = infos[activeDataset];
            const currentError = errors[activeDataset];

            return (
                <div className="flex w-full h-full">
                    <aside className="w-64 bg-white shadow-lg h-full flex flex-col z-20 flex-shrink-0">
                        <div className="p-6 border-b">
                            <h1 className="text-2xl font-bold text-blue-600 tracking-tight">TSAD Monitor</h1>
                            <p className="text-sm text-gray-500 mt-1">Anomaly Detection</p>
                        </div>
                        <div className="p-4 flex-1">
                            <h2 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Select Dataset</h2>
                            <div className="space-y-3">
                                {['2Dgesture', 'MSL'].map(m => {
                                    const isStreaming = datasetsStateRef.current[m]?.isStreaming;
                                    return (
                                        <button 
                                            key={m}
                                            onClick={() => selectDataset(m)}
                                            className={`w-full text-left px-4 py-3 rounded-lg border transition-all flex items-center justify-between ${
                                                activeDataset === m 
                                                    ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' 
                                                    : 'border-gray-200 bg-white hover:border-blue-300'
                                            }`}
                                        >
                                            <div className="flex items-center gap-2">
                                                {isStreaming && (
                                                    <span className="flex h-2 w-2 relative">
                                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                                        <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                                    </span>
                                                )}
                                                <span className={`font-medium ${activeDataset === m ? 'text-blue-700' : 'text-gray-700'}`}>{m}</span>
                                            </div>
                                            {activeDataset === m && (
                                                <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto bg-gray-50 p-6 lg:p-8 flex flex-col relative z-10">
                        {!activeDataset ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center">
                                <svg className="w-24 h-24 text-blue-200 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <h2 className="text-3xl font-bold text-gray-700 mb-2">Welcome to TSAD Monitor</h2>
                                <p className="text-gray-500">Select a dataset from the sidebar to start streaming.</p>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold text-gray-800">Dataset: {activeDataset}</h2>
                                        <button 
                                            onClick={() => fetchInfo(activeDataset)} 
                                            className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2"
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                            Refresh Metadata
                                        </button>
                                    </div>
                                    
                                    {currentError ? (
                                        <div className="bg-red-50 text-red-600 p-4 rounded-lg border border-red-100">
                                            {currentError}
                                        </div>
                                    ) : !currentInfo ? (
                                        <p className="text-gray-400 animate-pulse">Loading metadata...</p>
                                    ) : (
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                                            {[
                                                { label: 'Datapath', value: currentInfo.datapath },
                                                { label: 'Shape', value: `[${currentInfo.shape.join(', ')}]` },
                                                { label: 'DType', value: currentInfo.dtype },
                                                { label: 'Length', value: currentInfo.length },
                                                { label: 'Dimension', value: currentInfo.dimension },
                                                { 
                                                    label: 'Anomaly %', 
                                                    value: currentInfo.anomalyPercent !== null 
                                                        ? <span className="text-red-600 font-bold">{parseFloat(currentInfo.anomalyPercent).toFixed(2)}%</span>
                                                        : <span className="text-gray-400 font-normal">N/A</span>
                                                },
                                            ].map((item, idx) => (
                                                <div key={idx} className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                                                    <p className="text-xs text-gray-500 uppercase tracking-wider mb-1">{item.label}</p>
                                                    <p className="text-lg font-semibold text-gray-800 truncate" title={String(item.value)}>{item.value}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Removed overflow-hidden here to ensure Tooltip is never cut off */}
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col min-h-[500px]">
                                    <div className="flex flex-wrap justify-between items-center mb-4 gap-4">
                                        <div className="flex items-center gap-3">
                                            <h3 className="text-xl font-bold text-gray-800">Live Telemetry</h3>
                                            <span className="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-medium">Native Zoom/Pan</span>
                                        </div>
                                        
                                        <div className="flex items-center gap-3">
                                            <button 
                                                onClick={() => clearData()}
                                                className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg text-sm font-medium transition border border-red-200"
                                                title="Clear chart data completely"
                                            >
                                                Clear Data
                                            </button>

                                            <button 
                                                onClick={() => window.resetEChartZoom && window.resetEChartZoom()} 
                                                className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition"
                                            >
                                                Reset Zoom
                                            </button>

                                            <div className="relative">
                                                <button 
                                                    onClick={() => setIsFilterOpen(!isFilterOpen)}
                                                    className="bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                                                    Filter ({currentState.visibleFeatures?.size || 0})
                                                </button>
                                                {isFilterOpen && (
                                                    <>
                                                        <div className="fixed inset-0 z-30" onClick={() => setIsFilterOpen(false)}></div>
                                                        <div className="absolute right-0 mt-2 w-56 bg-white border border-gray-200 shadow-2xl rounded-lg z-40 flex flex-col">
                                                            <div className="p-3 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                                                                <span className="text-sm font-bold text-gray-700">Show Features</span>
                                                                <div className="flex gap-2">
                                                                    <button onClick={() => {
                                                                        const st = datasetsStateRef.current[activeDataset];
                                                                        const count = st.values.length || (currentInfo?.dimension || 0);
                                                                        st.visibleFeatures = new Set(Array.from({length: count}, (_, i) => i));
                                                                        setTick(t => t + 1);
                                                                    }} className="text-xs text-blue-600 hover:underline">All</button>
                                                                    <button onClick={() => {
                                                                        datasetsStateRef.current[activeDataset].visibleFeatures = new Set();
                                                                        setTick(t => t + 1);
                                                                    }} className="text-xs text-blue-600 hover:underline">None</button>
                                                                </div>
                                                            </div>
                                                            <div className="max-h-64 overflow-y-auto p-2">
                                                                {(() => {
                                                                    const numFeatures = currentState.values.length || (currentInfo?.dimension || 0);
                                                                    if (numFeatures === 0) return <div className="text-xs text-gray-400 p-2">Start stream to load features</div>;
                                                                    
                                                                    return Array.from({length: numFeatures}).map((_, i) => (
                                                                        <label key={i} className="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer">
                                                                            <input 
                                                                                type="checkbox" 
                                                                                className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer"
                                                                                checked={currentState.visibleFeatures?.has(i) || false}
                                                                                onChange={(e) => {
                                                                                    const st = datasetsStateRef.current[activeDataset];
                                                                                    const newSet = new Set(st.visibleFeatures);
                                                                                    if (e.target.checked) newSet.add(i);
                                                                                    else newSet.delete(i);
                                                                                    st.visibleFeatures = newSet;
                                                                                    setTick(t => t + 1);
                                                                                }}
                                                                            />
                                                                            <span className="text-sm font-medium select-none flex items-center gap-2">
                                                                                <span className="w-3 h-3 rounded-full" style={{backgroundColor: getFeatureColor(i)}}></span>
                                                                                Feature {i + 1}
                                                                            </span>
                                                                        </label>
                                                                    ));
                                                                })()}
                                                            </div>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                            
                                            {!currentState.isStreaming ? (
                                                <button 
                                                    onClick={startStream}
                                                    className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium shadow transition flex items-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>
                                                    Start Stream
                                                </button>
                                            ) : (
                                                <button 
                                                    onClick={stopStream}
                                                    className="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-medium shadow transition flex items-center gap-2"
                                                >
                                                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clipRule="evenodd"></path></svg>
                                                    Stop Stream
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* ECharts Container */}
                                    <div className="flex-1 w-full bg-white rounded-lg relative min-h-[350px]">
                                        <EChart 
                                            activeDataset={activeDataset} 
                                            datasetsStateRef={datasetsStateRef} 
                                            forceUpdate={tick} 
                                        />
                                    </div>
                                    
                                    <div className="mt-4 flex justify-between items-center text-sm">
                                        <span className={`font-medium ${
                                            currentState.isStreaming ? 'text-green-600 animate-pulse' : 
                                            currentState.status?.includes('Error') ? 'text-red-600' : 'text-gray-500'
                                        }`}>
                                            Status: {currentState.status}
                                        </span>
                                        <span className="bg-gray-100 text-gray-600 px-3 py-1.5 rounded-md font-mono">
                                            Points: {currentState.points || 0}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
